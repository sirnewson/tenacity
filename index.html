<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tenacity Branding - Pro Story Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bungee&family=Fredoka+One&family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@400;700;900&family=Pacifico&family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&family=Poppins:wght@400;700;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --brand-blue: #981491;
      --brand-blue-dark: #630b5e;
      --brand-accent: #ff47e2;
      --ink: #0f172a;
      --muted: #64748b;
      --soft: #f8fafc;
      --panel: rgba(255, 255, 255, 0.78);
      --stroke: rgba(148, 163, 184, 0.22);
      --shadow: 0 24px 70px rgba(15, 23, 42, 0.10);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      color: var(--ink);
      touch-action: manipulation;
      background:
        radial-gradient(circle at top left, rgba(255, 71, 226, .16), transparent 28rem),
        radial-gradient(circle at top right, rgba(152, 20, 145, .13), transparent 32rem),
        linear-gradient(135deg, #fff8fd 0%, #fcecfb 45%, #f8fafc 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .42;
      background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M18 20c12 0 12 20 24 20s12-20 24-20 12 20 24 20 12-20 24-20M0 72c12 0 12 20 24 20s12-20 24-20 12 20 24 20 12-20 24-20' stroke='%23981491' stroke-width='1.2' fill='none' opacity='0.13'/%3E%3C/svg%3E");
      mask-image: linear-gradient(to bottom, black, transparent 82%);
    }

    .app-shell { position: relative; z-index: 1; }

    .glass-panel {
      background: var(--panel);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,.8);
      box-shadow: var(--shadow);
      border-radius: 28px;
    }

    .panel-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }

    .step-badge {
      width: 28px; height: 28px; display: grid; place-items: center;
      border-radius: 999px; background: #fae6fb; color: var(--brand-blue);
      font-size: 11px; font-weight: 900;
    }

    .input-label {
      display: block; font-size: 10px; font-weight: 900; color: #64748b;
      text-transform: uppercase; letter-spacing: .14em; margin-bottom: 8px;
    }

    .mini-label { font-size: 10px; font-weight: 850; color: #64748b; text-transform: uppercase; letter-spacing: .08em; }

    .action-btn {
      width: 100%; display: flex; align-items: center; gap: 14px;
      min-height: 56px; padding: 14px 16px; border-radius: 18px;
      background: #fff; border: 1px solid rgba(148,163,184,.22);
      color: #0f172a; font-weight: 850; font-size: 14px;
      transition: .2s ease; box-shadow: 0 10px 28px rgba(15,23,42,.045);
    }

    .action-btn:hover {
      transform: translateY(-1px); border-color: rgba(152,20,145,.34);
      box-shadow: 0 18px 34px rgba(152,20,145,.10); color: var(--brand-blue);
    }

    .icon-chip {
      width: 34px; height: 34px; display: grid; place-items: center;
      border-radius: 13px; background: #fcebfc; flex-shrink: 0;
    }

    .tool-btn {
      padding: 12px 14px; border-radius: 15px; background: #fff;
      border: 1px solid rgba(148,163,184,.20); font-size: 10px;
      font-weight: 900; text-transform: uppercase; letter-spacing: .10em;
      color: #334155; transition: .2s ease;
    }

    .tool-btn:hover:not(:disabled) { background: #fcebfc; color: var(--brand-blue); }

    .frame-btn {
      width: 100%; padding: 15px 16px; border-radius: 18px;
      background: rgba(255,255,255,.78); border: 1px solid rgba(148,163,184,.22);
      color: #334155; font-size: 11px; font-weight: 900;
      text-transform: uppercase; letter-spacing: .08em; transition: .2s ease; text-align: left;
    }

    .frame-btn:hover { transform: translateY(-1px); background: #fff; border-color: rgba(152,20,145,.35); }
    .frame-btn.active { background: linear-gradient(135deg, #981491, #630b5e); color: #fff; border-color: transparent; box-shadow: 0 18px 35px rgba(152,20,145,.23); }

    .layer-item {
      display: flex; align-items: center; gap: 13px; padding: 12px;
      border-radius: 18px; border: 1px solid rgba(148,163,184,.18);
      background: rgba(255,255,255,.72); cursor: pointer; transition: .2s ease;
    }

    .layer-item:hover { background: #fff; transform: translateX(2px); }
    .layer-item.selected { border-color: rgba(152,20,145,.75); background: #981491; color: #fff !important; box-shadow: 0 16px 30px rgba(152,20,145,.18); }

    .delete-btn {
      width: 100%; padding: 15px; background: #fff1f2; color: #e11d48;
      font-weight: 950; border-radius: 18px; transition: .2s ease;
      text-transform: uppercase; font-size: 10px; letter-spacing: .13em;
      border: 1px solid rgba(244, 63, 94, .15); margin-top: 18px;
    }

    input[type="range"] { width: 100%; accent-color: var(--brand-blue); }

    #canvas-container {
      position: relative; width: min(100%, 520px); aspect-ratio: 4 / 5;
      border-radius: 30px; overflow: hidden; background: #fff;
      box-shadow: 0 42px 90px rgba(15,23,42,.22), 0 0 0 10px rgba(255,255,255,.65);
      touch-action: none;
    }

    #canvas { width: 100%; height: 100%; display: block; }

    .preview-card { position: sticky; top: 24px; width: 100%; display: flex; flex-direction: column; align-items: center; }

    .export-btn {
      margin-top: 30px; display: inline-flex; align-items: center; justify-content: center;
      gap: 12px; min-width: 240px; padding: 18px 26px; border-radius: 999px;
      background: linear-gradient(135deg, #981491, #630b5e); color: #fff;
      font-weight: 950; text-transform: uppercase; font-size: 12px; letter-spacing: .16em;
      box-shadow: 0 24px 45px rgba(152,20,145,.28); transition: .2s ease;
    }

    .mobile-toolbar {
      position: sticky; bottom: 12px; z-index: 20; display: none; gap: 8px;
      padding: 8px; margin-top: 18px; border-radius: 22px; background: rgba(255,255,255,.86);
      backdrop-filter: blur(16px); box-shadow: 0 18px 48px rgba(15,23,42,.18);
      border: 1px solid rgba(255,255,255,.8);
    }

    .mobile-toolbar button, .mobile-toolbar label {
      flex: 1; min-height: 48px; display: grid; place-items: center;
      border-radius: 16px; background: #f8fafc; font-size: 18px; cursor: pointer;
    }

    @media (max-width: 1023px) {
      .preview-card { position: static; }
      .mobile-toolbar { display: flex; }
      aside { order: 2; }
      main { order: 1; }
    }
  </style>
</head>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let CANVAS_WIDTH = 1080, CANVAS_HEIGHT = 1350;

    let layers = [], selectedLayer = null;
    let isDragging = false, dragStart = { x: 0, y: 0 };
    let undoStack = [], redoStack = [];
    let currentOverlayIdx = 0, loadedOverlays = [];
    let showGrid = false;
    let canvasBg = '#ffffff';

    const overlayUrls = [
      'https://i.ibb.co/fVLvkVWS/overlay.png',
      'https://i.ibb.co/8nF518H6/overlay-1-stories.png',
      'https://i.ibb.co/Xx44ZWgJ/reeel-overlay.png',
      'https://i.ibb.co/WpxPSZWk/post-overlay.png'
    ];

    async function init() {
      loadedOverlays = await Promise.all(overlayUrls.map(url => new Promise(resolve => {
        const img = new Image(); img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img); img.onerror = () => resolve(null);
        img.src = url;
      })));
      
      updateCanvasDimensions();
      setupEventListeners();
      updateHistoryBtns();
      updateLayerList();
      draw();
    }

    function updateCanvasDimensions() {
      if (loadedOverlays[currentOverlayIdx]) {
        CANVAS_WIDTH = loadedOverlays[currentOverlayIdx].naturalWidth || 1080;
        CANVAS_HEIGHT = loadedOverlays[currentOverlayIdx].naturalHeight || 1350;
      } else {
        CANVAS_WIDTH = 1080; CANVAS_HEIGHT = 1350;
      }
      canvas.width = CANVAS_WIDTH; 
      canvas.height = CANVAS_HEIGHT;
      document.getElementById('canvas-container').style.aspectRatio = `${CANVAS_WIDTH} / ${CANVAS_HEIGHT}`;
    }

    function draw() {
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      ctx.fillStyle = canvasBg;
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      if (showGrid) drawGrid();

      // Helper to render a single layer
      const renderLayer = (layer) => {
        ctx.save();
        ctx.globalAlpha = layer.opacity !== undefined ? layer.opacity : 1;
        
        const cx = layer.type === 'text' ? layer.x : layer.x + layer.width / 2;
        const cy = layer.type === 'text' ? layer.y : layer.y + layer.height / 2;
        
        if (layer.shadow && layer.shadow > 0) {
           ctx.shadowColor = 'rgba(0,0,0,0.5)';
           ctx.shadowBlur = layer.shadow;
           ctx.shadowOffsetX = layer.shadow / 2;
           ctx.shadowOffsetY = layer.shadow / 2;
        }

        ctx.translate(cx, cy);
        ctx.rotate((layer.rotation || 0) * Math.PI / 180);
        if (layer.flipped) ctx.scale(-1, 1);
        ctx.translate(-cx, -cy);

        if (layer.type === 'text') drawTextLayer(layer);
        else if (layer.type === 'image' && layer.img) ctx.drawImage(layer.img, layer.x, layer.y, layer.width, layer.height);
        else if (layer.type === 'circle-image') drawCircleLayer(layer);
        
        ctx.restore();
      };

      // 1. Draw Images (Behind the overlay)
      [...layers].filter(l => l.type !== 'text').sort((a,b) => a.zIndex - b.zIndex).forEach(renderLayer);

      // 2. Draw the Overlay Frame
      if (loadedOverlays[currentOverlayIdx]) {
        ctx.drawImage(loadedOverlays[currentOverlayIdx], 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      }

      // 3. Draw Texts (On top of the overlay)
      [...layers].filter(l => l.type === 'text').sort((a,b) => a.zIndex - b.zIndex).forEach(renderLayer);

      if (selectedLayer) drawSelectionHighlight(selectedLayer);
    }

    function drawGrid() {
       ctx.save(); ctx.strokeStyle = 'rgba(0,0,0,0.05)'; ctx.lineWidth = 2;
       const stepX = CANVAS_WIDTH / 10; const stepY = CANVAS_HEIGHT / 10;
       for (let i = 0; i < CANVAS_WIDTH; i += stepX) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, CANVAS_HEIGHT); ctx.stroke(); }
       for (let j = 0; j < CANVAS_HEIGHT; j += stepY) { ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(CANVAS_WIDTH, j); ctx.stroke(); }
       ctx.restore();
    }

    function drawTextLayer(l) {
      ctx.font = `bold ${l.size}px "${l.font || 'Inter'}"`;
      ctx.textAlign = l.align || 'center'; 
      ctx.textBaseline = 'middle';
      
      const lines = (l.text || '').split('\n');
      const lineHeight = l.size * 1.2;
      const startY = l.y - ((lines.length - 1) * lineHeight) / 2;

      lines.forEach((line, index) => {
        const lineY = startY + index * lineHeight;
        if (l.textStrokeWidth && l.textStrokeWidth > 0) {
          ctx.lineWidth = l.textStrokeWidth * 2;
          ctx.strokeStyle = l.textStrokeColor || '#000000';
          ctx.strokeText(line, l.x, lineY);
        }
        ctx.fillStyle = l.color;
        ctx.fillText(line, l.x, lineY);
      });
    }

    function drawCircleLayer(l) {
      if (!l.img) return;
      const cx = l.x + l.width / 2; const cy = l.y + l.height / 2;
      const r = Math.min(l.width, l.height) / 2;
      ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
      ctx.drawImage(l.img, l.x, l.y, l.width, l.height); ctx.restore();
      if (l.strokeWidth && l.strokeWidth > 0) {
        ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.lineWidth = l.strokeWidth; ctx.strokeStyle = l.strokeColor || '#ffffff';
        ctx.stroke(); ctx.restore();
      }
    }

    function drawSelectionHighlight(l) {
      ctx.save(); ctx.strokeStyle = '#981491'; ctx.setLineDash([12, 10]); ctx.lineWidth = 4;
      const cx = l.type === 'text' ? l.x : l.x + l.width / 2;
      const cy = l.type === 'text' ? l.y : l.y + l.height / 2;
      ctx.translate(cx, cy); ctx.rotate((l.rotation || 0) * Math.PI / 180); ctx.translate(-cx, -cy);
      
      if (l.type === 'text') {
        ctx.font = `bold ${l.size}px "${l.font || 'Inter'}"`;
        const lines = (l.text || '').split('\n');
        const maxW = Math.max(...lines.map(line => ctx.measureText(line).width));
        const w = maxW + 70;
        const h = lines.length * (l.size * 1.2) + 20;
        
        let drawX = l.x - w / 2;
        if (l.align === 'left') drawX = l.x - 35; 
        else if (l.align === 'right') drawX = l.x - maxW - 35;
        
        ctx.strokeRect(drawX, l.y - h / 2, w, h);
      } else { 
        ctx.strokeRect(l.x - 6, l.y - 6, l.width + 12, l.height + 12); 
      }
      ctx.restore();
    }

    function setupEventListeners() {
      canvas.onmousedown = onPointerDown;
      canvas.ontouchstart = e => onPointerDown(e.touches[0], e);
      window.onmousemove = onPointerMove;
      window.ontouchmove = e => { if (isDragging) e.preventDefault(); onPointerMove(e.touches[0]); };
      window.onmouseup = onPointerUp; window.ontouchend = onPointerUp;

      document.getElementById('imgUpload').onchange = e => handleFile(e, 'image');
      document.getElementById('circleImgUpload').onchange = e => handleFile(e, 'circle-image');
      document.getElementById('mobileImgUpload').onchange = e => handleFile(e, 'image');
      document.getElementById('addTextBtn').onclick = () => addLayer('text', 'STORY TEXT');
      document.getElementById('addProductBtn').onclick = addProductLabels;
      document.getElementById('mobileTextBtn').onclick = () => addLayer('text', 'STORY TEXT');

      bindRange('inputRotation', 'rotation');
      bindRange('inputScale', 'scale', true);
      bindRange('inputShadow', 'shadow');
      bindRange('inputStrokeWidth', 'strokeWidth');
      bindRange('inputTextStrokeWidth', 'textStrokeWidth');

      document.getElementById('canvasBgColor').oninput = e => { canvasBg = e.target.value; draw(); };
      document.getElementById('gridToggle').onchange = e => { showGrid = e.target.checked; draw(); };

      document.getElementById('saveDesignBtn').onclick = exportDesignFile;
      document.getElementById('importDesignInput').onchange = importDesignFile;

      document.getElementById('btnCenter').onclick = () => {
         if (!selectedLayer) return;
         if (selectedLayer.type === 'text') {
            selectedLayer.x = CANVAS_WIDTH / 2; selectedLayer.y = CANVAS_HEIGHT / 2;
         } else {
            selectedLayer.x = (CANVAS_WIDTH - selectedLayer.width) / 2;
            selectedLayer.y = (CANVAS_HEIGHT - selectedLayer.height) / 2;
         }
         draw(); saveState();
      };

      document.getElementById('btnDuplicate').onclick = () => {
         if (!selectedLayer) return;
         const clone = JSON.parse(JSON.stringify(selectedLayer));
         clone.id = Date.now(); clone.x += 40; clone.y += 40; clone.zIndex += 1;
         if (selectedLayer.img) clone.img = selectedLayer.img;
         layers.push(clone); selectLayer(clone); saveState();
      };

      document.getElementById('inputStrokeColor').oninput = e => { if (selectedLayer) { selectedLayer.strokeColor = e.target.value; draw(); } };
      document.getElementById('inputTextStrokeColor').oninput = e => { if (selectedLayer) { selectedLayer.textStrokeColor = e.target.value; draw(); } };
      document.getElementById('inputText').oninput = e => { if (selectedLayer) { selectedLayer.text = e.target.value; updateLayerList(); draw(); } };
      document.getElementById('inputColor').oninput = e => { if (selectedLayer) { selectedLayer.color = e.target.value; draw(); } };
      document.getElementById('inputAlign').onchange = e => { if (selectedLayer) { selectedLayer.align = e.target.value; draw(); saveState(); } };
      document.getElementById('inputFont').onchange = e => { if (selectedLayer) { selectedLayer.font = e.target.value; draw(); saveState(); } };

      document.getElementById('btnFront').onclick = () => { if (selectedLayer) { selectedLayer.zIndex = (layers.length ? Math.max(...layers.map(l => l.zIndex)) : 0) + 1; draw(); saveState(); } };
      document.getElementById('btnBack').onclick = () => { if (selectedLayer) { selectedLayer.zIndex = (layers.length ? Math.min(...layers.map(l => l.zIndex)) : 0) - 1; draw(); saveState(); } };
      document.getElementById('btnFlip').onclick = () => { if (selectedLayer) { selectedLayer.flipped = !selectedLayer.flipped; draw(); saveState(); } };
      document.getElementById('deleteLayerBtn').onclick = () => { if (selectedLayer) { saveState(); layers = layers.filter(l => l.id !== selectedLayer.id); selectLayer(null); } };

      document.querySelectorAll('.frame-btn').forEach(b => b.onclick = () => {
        currentOverlayIdx = parseInt(b.dataset.idx);
        document.querySelectorAll('.frame-btn').forEach(btn => btn.classList.remove('active'));
        b.classList.add('active'); 
        updateCanvasDimensions();
        draw();
      });

      document.getElementById('exportBtn').onclick = exportPost;
      document.getElementById('mobileExportBtn').onclick = exportPost;
      document.getElementById('undoBtn').onclick = undo;
      document.getElementById('redoBtn').onclick = redo;
      document.getElementById('mobileUndoBtn').onclick = undo;
    }

    function onPointerDown(e, originalEvent) {
      const pos = getMousePos(e);
      const found = [...layers].sort((a,b) => b.zIndex - a.zIndex).find(l => isPointInLayer(pos, l));
      if (found) { selectLayer(found); isDragging = true; dragStart = { x: pos.x - found.x, y: pos.y - found.y }; }
      else { selectLayer(null); }
    }

    function onPointerMove(e) { if (isDragging && selectedLayer) { const p = getMousePos(e); selectedLayer.x = p.x - dragStart.x; selectedLayer.y = p.y - dragStart.y; draw(); } }
    function onPointerUp() { if (isDragging) saveState(); isDragging = false; }

    function bindRange(id, prop, isScale = false) {
      const el = document.getElementById(id);
      el.oninput = () => {
        if (!selectedLayer) return;
        const val = parseInt(el.value);
        if (isScale) {
           const s = val / 100;
           if (selectedLayer.type === 'text') selectedLayer.size = Math.round(80 * s);
           else if (selectedLayer.img) { selectedLayer.width = selectedLayer.img.naturalWidth * s; selectedLayer.height = selectedLayer.img.naturalHeight * s; }
           document.getElementById('valScale').innerText = val + '%';
        } else {
           selectedLayer[prop] = val;
           const indId = 'val' + prop.charAt(0).toUpperCase() + prop.slice(1);
           const ind = document.getElementById(indId);
           if (ind) ind.innerText = val + (prop === 'rotation' ? '°' : (prop === 'shadow' ? '' : 'px'));
        }
        draw();
      };
      el.onchange = saveState;
    }

    function selectLayer(l) {
      selectedLayer = l;
      const panel = document.getElementById('settings-panel');
      if (!l) { panel.classList.add('hidden'); } else {
        panel.classList.remove('hidden');
        document.getElementById('inputRotation').value = l.rotation || 0;
        document.getElementById('valRotation').innerText = (l.rotation || 0) + '°';
        document.getElementById('inputShadow').value = l.shadow || 0;
        document.getElementById('valShadow').innerText = l.shadow || 0;
        
        let sVal = 100;
        if (l.type === 'text') sVal = Math.round((l.size / 80) * 100);
        else if (l.img) sVal = Math.round((l.width / l.img.naturalWidth) * 100);
        document.getElementById('inputScale').value = sVal;
        document.getElementById('valScale').innerText = sVal + '%';

        document.getElementById('circle-extras').classList.toggle('hidden', l.type !== 'circle-image');
        if (l.type === 'circle-image') {
          document.getElementById('inputStrokeWidth').value = l.strokeWidth || 0;
          document.getElementById('valStrokeWidth').innerText = (l.strokeWidth || 0) + 'px';
          document.getElementById('inputStrokeColor').value = l.strokeColor || '#ffffff';
        }

        document.getElementById('text-extras').classList.toggle('hidden', l.type !== 'text');
        if (l.type === 'text') {
          document.getElementById('inputText').value = l.text;
          document.getElementById('inputColor').value = l.color;
          document.getElementById('inputAlign').value = l.align || 'center';
          document.getElementById('inputTextStrokeWidth').value = l.textStrokeWidth || 0;
          document.getElementById('valTextStrokeWidth').innerText = (l.textStrokeWidth || 0) + 'px';
          document.getElementById('inputTextStrokeColor').value = l.textStrokeColor || '#000000';
        }
      }
      updateLayerList(); draw();
    }

    function handleFile(e, type) {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader(); r.onload = evt => addLayer(type, evt.target.result); r.readAsDataURL(f);
      e.target.value = '';
    }

    function addLayer(type, src) {
      saveState(); const id = Date.now();
      const z = layers.length ? Math.max(...layers.map(l => l.zIndex)) + 1 : 1;
      let l = { id, type, zIndex: z, opacity: 1, rotation: 0, flipped: false, shadow: 0 };
      if (type === 'text') {
        l = { ...l, text: src, x: CANVAS_WIDTH / 2, y: CANVAS_HEIGHT / 2, size: 80, color: '#0f172a', font: 'Inter', align: 'center', textStrokeWidth: 0, textStrokeColor: '#000000' };
        layers.push(l); selectLayer(l);
      } else {
        const i = new Image(); i.crossOrigin = 'anonymous';
        i.onload = () => {
          const s = Math.min((CANVAS_WIDTH * .7) / i.naturalWidth, .7);
          l.img = i; l.width = i.naturalWidth * s; l.height = i.naturalHeight * s;
        l.x = (CANVAS_WIDTH - l.width) / 2; l.y = (CANVAS_HEIGHT - l.height) / 2;
        if (type === 'circle-image') { l.strokeWidth = 0; l.strokeColor = '#ffffff'; }
        layers.push(l); selectLayer(l);
      };
      i.src = src;
    }
  }

  function getMousePos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (CANVAS_WIDTH / r.width), y: (e.clientY - r.top) * (CANVAS_HEIGHT / r.height) };
  }

  function addProductLabels() {
    saveState();
    const zBase = layers.length ? Math.max(...layers.map(l => l.zIndex)) + 1 : 1;
    
    // Creating the exact text elements mapped to the provided coordinates
    const titleLayer = { id: Date.now(), type: 'text', text: '90 ACC', x: 195, y: 1001, size: 55, color: '#ffffff', font: 'Plus Jakarta Sans', align: 'left', zIndex: zBase, opacity: 1, rotation: 0, shadow: 0 };
    const descLayer = { id: Date.now()+1, type: 'text', text: 'Tenacity 3-pin\nWith pure brass\nDimple keys', x: 195, y: 1081, size: 26, color: '#ffffff', font: 'Plus Jakarta Sans', align: 'left', zIndex: zBase+1, opacity: 1, rotation: 0, shadow: 0 };
    const curLayer = { id: Date.now()+2, type: 'text', text: 'KSH', x: 550, y: 1040, size: 30, color: '#ffffff', font: 'Bebas Neue', align: 'left', zIndex: zBase+2, opacity: 1, rotation: 0, shadow: 0 };
    const priceLayer = { id: Date.now()+3, type: 'text', text: '6,000/=', x: 625, y: 1100, size: 95, color: '#ffffff', font: 'Bebas Neue', align: 'left', zIndex: zBase+3, opacity: 1, rotation: 0, shadow: 0 };

    layers.push(titleLayer, descLayer, curLayer, priceLayer);
    
    // Auto-switch to Post Overlay to match the product label context
    currentOverlayIdx = 0;
    document.querySelectorAll('.frame-btn').forEach((btn, idx) => {
      btn.classList.toggle('active', idx === currentOverlayIdx);
    });
    updateCanvasDimensions();
    
    selectLayer(titleLayer);
  }

  function isPointInLayer(p, l) {
    if (l.type === 'text') {
      ctx.font = `bold ${l.size}px "${l.font || 'Inter'}"`;
        const lines = (l.text || '').split('\n');
        const maxW = Math.max(...lines.map(line => ctx.measureText(line).width));
        const w = maxW + 60;
        const h = lines.length * (l.size * 1.2) + 20;
        
        let left = l.x - w / 2;
        if (l.align === 'left') left = l.x - 30;
        else if (l.align === 'right') left = l.x - maxW - 30;

        const top = l.y - h / 2;
        return p.x > left && p.x < left + w && p.y > top && p.y < top + h;
      }
      return p.x > l.x && p.x < l.x + l.width && p.y > l.y && p.y < l.y + l.height;
    }

    function updateLayerList() {
      const list = document.getElementById('layerList');
      list.innerHTML = layers.length ? '' : '<div class="text-xs text-slate-400 text-center py-4 font-bold">No layers yet.</div>';
      [...layers].sort((a,b) => b.zIndex - a.zIndex).forEach(l => {
        const d = document.createElement('div');
        d.className = `layer-item ${selectedLayer?.id === l.id ? 'selected' : ''}`;
        d.innerHTML = `<div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center font-black overflow-hidden">${l.type === 'text' ? 'Aa' : `<img src="${l.img.src}" class="w-full h-full object-cover">`}</div><span class="text-[11px] font-black uppercase truncate">${l.type === 'text' ? l.text : l.type}</span>`;
        d.onclick = () => selectLayer(l); list.appendChild(d);
      });
    }

    function saveState() {
      const s = JSON.stringify(layers.map(l => { const c = {...l}; if(c.img) c._imgSrc = c.img.src; delete c.img; return c; }));
      undoStack.push(s); redoStack = []; updateHistoryBtns();
    }

    async function undo() {
      if (!undoStack.length) return;
      redoStack.push(JSON.stringify(layers.map(l => { const c = {...l}; if(c.img) c._imgSrc = c.img.src; delete c.img; return c; })));
      layers = await restore(JSON.parse(undoStack.pop())); selectLayer(null); updateHistoryBtns();
    }
    async function redo() {
      if (!redoStack.length) return;
      undoStack.push(JSON.stringify(layers.map(l => { const c = {...l}; if(c.img) c._imgSrc = c.img.src; delete c.img; return c; })));
      layers = await restore(JSON.parse(redoStack.pop())); selectLayer(null); updateHistoryBtns();
    }
    async function restore(s) {
      for (const l of s) if (l._imgSrc) { const i = new Image(); i.crossOrigin = 'anonymous'; i.src = l._imgSrc; await new Promise(r => { i.onload = r; i.onerror = r; }); l.img = i; delete l._imgSrc; }
      return s;
    }
    function updateHistoryBtns() { document.getElementById('undoBtn').disabled = !undoStack.length; document.getElementById('redoBtn').disabled = !redoStack.length; }

    function exportDesignFile() {
      const project = {
         version: "1.0",
         canvasBg,
         currentOverlayIdx,
         layers: layers.map(l => { const c = {...l}; if(c.img) c._imgSrc = c.img.src; delete c.img; return c; })
      };
      const blob = new Blob([JSON.stringify(project)], { type: "application/json" });
      const a = document.createElement('a');
      a.download = `Design_${Date.now()}.tenacity`;
      a.href = URL.createObjectURL(blob);
      a.click();
    }

    async function importDesignFile(e) {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = async (evt) => {
         try {
            const project = JSON.parse(evt.target.result);
            canvasBg = project.canvasBg || '#ffffff';
            document.getElementById('canvasBgColor').value = canvasBg;
            currentOverlayIdx = project.currentOverlayIdx || 0;
            document.querySelectorAll('.frame-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === currentOverlayIdx);
            });
            layers = await restore(project.layers);
            selectLayer(null);
            saveState();
         } catch (err) {
            console.error("Invalid project file");
         }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function exportPost() {
      const cur = selectedLayer; selectedLayer = null; draw();
      setTimeout(() => {
        const a = document.createElement('a'); a.download = `Tenacity_${Date.now()}.png`; a.href = canvas.toDataURL('image/png', 1.0); a.click();
        selectedLayer = cur; draw();
      }, 100);
    }

    window.onload = init;
  </script>
</body>

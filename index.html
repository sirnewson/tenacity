<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tenacity Locks Survey</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --brand-purple: #4a0c47;
            --brand-purple-light: #871881;
            --brand-purple-dark: #2a0429;
            --brand-yellow: #ffe800;
            --brand-yellow-hover: #ffc400;
            --whatsapp-green: #25d366;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(-45deg, var(--brand-purple-dark), var(--brand-purple), var(--brand-purple-light), var(--brand-purple));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            /* Kiosk touch optimizations */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation; /* Prevents double-tap zoom */
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Hide scrollbar but keep functionality */
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .option-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.2rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .option-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,232,0,0.2) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .option-card:active {
            transform: scale(0.92);
        }

        /* Selected State for Multi-Select */
        .option-card.selected {
            background: rgba(255, 232, 0, 0.1);
            border-color: var(--brand-yellow);
            box-shadow: 0 10px 30px rgba(255, 232, 0, 0.2), inset 0 0 15px rgba(255, 232, 0, 0.1);
            transform: translateY(-5px);
        }

        .option-card.selected::before { opacity: 1; }
        .option-card.selected .icon-container { color: var(--brand-yellow); transform: scale(1.15); }
        .option-card.selected .option-text { color: #fff; font-weight: 600; }
        
        .check-indicator {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.5rem;
            color: var(--brand-yellow);
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .option-card.selected .check-indicator {
            opacity: 1;
            transform: scale(1);
        }

        .icon-container {
            font-size: 3.5rem;
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .option-text {
            font-size: 1.3rem;
            font-weight: 400;
            line-height: 1.3;
            color: rgba(255, 255, 255, 0.9);
            position: relative;
            z-index: 2;
            transition: all 0.3s ease;
        }

        .expandable-section {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
        }

        .expandable-section.show {
            grid-template-rows: 1fr;
        }

        .expandable-content {
            overflow: hidden;
        }

        .input-group {
            position: relative;
            width: 100%;
            margin-bottom: 1.2rem;
        }

        .input-group i {
            position: absolute;
            left: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.4rem;
            color: rgba(255, 255, 255, 0.5);
            transition: color 0.3s ease;
        }

        .custom-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 1.25rem 1.25rem 1.25rem 4rem;
            font-size: 1.25rem;
            color: white;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
        }

        .custom-input::placeholder { color: rgba(255, 255, 255, 0.4); }

        .custom-input:focus {
            border-color: var(--brand-yellow);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 20px rgba(255, 232, 0, 0.15);
        }

        .custom-input:focus + i, .custom-input:not(:placeholder-shown) + i {
            color: var(--brand-yellow);
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--brand-yellow), var(--brand-yellow-hover));
            color: var(--brand-purple-dark);
            border: none;
            border-radius: 9999px;
            padding: 1.25rem 3rem;
            font-size: 1.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 10px 30px -5px rgba(255, 232, 0, 0.5);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            opacity: 0;
            transform: translateY(30px) scale(0.9);
            pointer-events: none;
            width: 100%;
            max-width: 400px;
        }

        .submit-btn.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .submit-btn.active:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 40px -5px rgba(255, 232, 0, 0.6);
        }

        .submit-btn.active:active {
            transform: translateY(2px) scale(0.95);
        }

        .success-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .success-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .check-circle-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            margin-bottom: 2rem;
        }

        .check-circle {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--whatsapp-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            color: white;
            transform: scale(0);
            box-shadow: 0 20px 50px rgba(37, 211, 102, 0.4);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2;
        }

        .success-overlay.show .check-circle { transform: scale(1); }

        .pulse-ring {
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            border: 4px solid var(--whatsapp-green);
            opacity: 0;
            animation: none;
            z-index: 1;
        }

        .success-overlay.show .pulse-ring {
            animation: pulseOut 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
            animation-delay: 0.6s;
        }

        @keyframes pulseOut {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* Toast Notification */
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: white;
            color: #333;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 100;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #toast.show { transform: translateX(-50%) translateY(0); }

        /* Fullscreen button */
        .fs-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 10;
            backdrop-filter: blur(5px);
            transition: all 0.2s;
        }
        .fs-btn:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <button class="fs-btn" onclick="toggleFullScreen()" title="Toggle Fullscreen">
        <i class="fa-solid fa-expand" id="fs-icon"></i>
    </button>

    <!-- Toast for admin messages -->
    <div id="toast"><i class="fa-solid fa-download text-green-500 mr-2"></i> Session data exported!</div>

    <div class="flex-grow flex flex-col items-center justify-start p-4 sm:p-8 w-full max-w-[1400px] mx-auto overflow-y-auto no-scrollbar pb-32">
        
        <!-- Header with Logo -->
        <div class="text-center mb-8 w-full flex flex-col items-center mt-4">
            <img 
                src="https://tenacitylockslimited.com/assets/images/logos/white-logo.png" 
                alt="Tenacity Locks" 
                class="h-16 md:h-24 object-contain mb-6 drop-shadow-2xl cursor-pointer"
                id="logoImg"
                title="Tap 5 times to download session data"
            >
            <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold leading-tight drop-shadow-lg">
                How did you hear about us? <span class="text-[#ffe800]">*</span>
            </h1>
            <p class="text-slate-300 mt-3 text-lg md:text-xl font-light">Select all that apply</p>
        </div>

        <!-- Responsive touch-target grid -->
        <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-5 lg:gap-6 w-full mb-8" id="optionsContainer">
            <!-- Cards rendered by JS -->
        </div>

        <div class="w-full max-w-4xl flex flex-col items-center">
            
            <!-- Other Input Section -->
            <div id="otherInputSection" class="expandable-section w-full">
                <div class="expandable-content pt-2 pb-6 w-full flex justify-center">
                    <div class="w-full md:w-3/4">
                        <div class="input-group">
                            <input type="text" id="otherTextInput" class="custom-input" placeholder="Please specify..." autocomplete="off">
                            <i class="fa-solid fa-pen"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Contact Section -->
            <div id="contactSection" class="expandable-section w-full">
                <div class="expandable-content w-full pb-8">
                    <div class="glass-panel rounded-3xl p-6 md:p-10 w-full">
                        <h3 class="text-2xl md:text-3xl font-semibold mb-2 text-center text-[#ffe800]">Almost Done!</h3>
                        <p class="text-center text-slate-300 mb-8 font-light">Leave your details for exclusive offers <span class="opacity-60">(Optional)</span></p>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 w-full">
                            <div class="input-group md:col-span-2">
                                <input type="text" id="nameInput" class="custom-input" placeholder="Full Name" autocomplete="off">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <div class="input-group">
                                <input type="tel" id="phoneInput" class="custom-input" placeholder="Phone Number" autocomplete="off">
                                <i class="fa-solid fa-phone"></i>
                            </div>
                            <div class="input-group">
                                <input type="email" id="emailInput" class="custom-input" placeholder="Email Address" autocomplete="off">
                                <i class="fa-solid fa-envelope"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="mt-4 flex justify-center w-full">
                <button id="submitBtn" class="submit-btn" onclick="submitSurvey()">
                    <span>Submit</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="successOverlay" class="success-overlay">
        <div class="check-circle-wrapper">
            <div class="pulse-ring"></div>
            <div class="check-circle">
                <i class="fa-solid fa-check"></i>
            </div>
        </div>
        <h2 class="text-5xl md:text-7xl font-bold mb-4 text-center text-white drop-shadow-lg">Thank You!</h2>
        <p class="text-2xl md:text-3xl text-slate-200 text-center max-w-3xl px-4 font-light drop-shadow-md">
            We truly appreciate your feedback.
        </p>
        <p class="text-xl text-[#ffe800] mt-12 font-medium">
            Resetting in <span id="resetTimer" class="font-bold text-2xl">5</span>...
        </p>
    </div>

    <script>
        // Survey Options Data
        const surveyOptions = [
            { id: 'tiktok', label: 'Tiktok', icon: 'fa-brands fa-tiktok' },
            { id: 'facebook', label: 'Facebook', icon: 'fa-brands fa-facebook' },
            { id: 'instagram', label: 'Instagram', icon: 'fa-brands fa-instagram' },
            { id: 'google', label: 'Google', icon: 'fa-brands fa-google' },
            { id: 'return', label: 'Return Customer', icon: 'fa-solid fa-arrow-rotate-left' },
            { id: 'referral', label: 'Referral', icon: 'fa-solid fa-users' },
            { id: 'longterm', label: 'Long Term<br><span class="text-sm opacity-70">(> 3 years)</span>', icon: 'fa-solid fa-award' },
            { id: 'walkin', label: 'Walk In<br><span class="text-sm opacity-70">(Passing by)</span>', icon: 'fa-solid fa-person-walking' },
            { id: 'other', label: 'Other', icon: 'fa-solid fa-ellipsis' }
        ];

        // State Management
        let selectedOptionIds = new Set();
        let sessionDataStore = []; // In-memory database
        let inactivityTimer = null;
        let logoTapCount = 0;
        let logoTapTimer = null;
        const INACTIVITY_TIMEOUT = 120000; // 2 minutes

        // DOM Elements
        const optionsContainer = document.getElementById('optionsContainer');
        const otherInputSection = document.getElementById('otherInputSection');
        const otherTextInput = document.getElementById('otherTextInput');
        const contactSection = document.getElementById('contactSection');
        const submitBtn = document.getElementById('submitBtn');
        const successOverlay = document.getElementById('successOverlay');
        const resetTimerEl = document.getElementById('resetTimer');
        const logoImg = document.getElementById('logoImg');
        const toast = document.getElementById('toast');

        function init() {
            renderOptions();
            setupEventListeners();
            resetInactivityTimer();
        }

        function renderOptions() {
            optionsContainer.innerHTML = '';
            
            surveyOptions.forEach(option => {
                const card = document.createElement('div');
                card.className = 'option-card';
                card.id = `opt-${option.id}`;
                card.onclick = () => toggleOption(option.id);
                
                card.innerHTML = `
                    <div class="check-indicator"><i class="fa-solid fa-circle-check"></i></div>
                    <div class="icon-container">
                        <i class="${option.icon}"></i>
                    </div>
                    <div class="option-text">${option.label}</div>
                `;
                
                optionsContainer.appendChild(card);
            });
        }

        function toggleOption(id) {
            resetInactivityTimer();
            
            // Toggle selection in Set
            if (selectedOptionIds.has(id)) {
                selectedOptionIds.delete(id);
                document.getElementById(`opt-${id}`).classList.remove('selected');
            } else {
                selectedOptionIds.add(id);
                document.getElementById(`opt-${id}`).classList.add('selected');
            }
            
            // Handle "Other" input visibility
            if (selectedOptionIds.has('other')) {
                otherInputSection.classList.add('show');
                // Scroll slightly to ensure it's in view
                setTimeout(() => {
                    otherTextInput.focus();
                    otherTextInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 300);
            } else {
                otherInputSection.classList.remove('show');
            }

            // Show contact section if AT LEAST ONE option is selected
            if (selectedOptionIds.size > 0) {
                contactSection.classList.add('show');
            } else {
                contactSection.classList.remove('show');
            }

            checkSubmitValidity();
        }

        function checkSubmitValidity() {
            let isValid = selectedOptionIds.size > 0;
            
            // If 'other' is selected, ensure they typed something
            if (selectedOptionIds.has('other') && otherTextInput.value.trim().length === 0) {
                isValid = false;
            }
            
            if (isValid) {
                submitBtn.classList.add('active');
            } else {
                submitBtn.classList.remove('active');
            }
        }

        function setupEventListeners() {
            // Validate on typing
            otherTextInput.addEventListener('input', () => {
                resetInactivityTimer();
                checkSubmitValidity();
            });

            // Auto-scroll for touch keyboards
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    setTimeout(() => {
                        input.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 300);
                });
                input.addEventListener('input', resetInactivityTimer);
            });

            // Global activity tracking
            ['touchstart', 'mousemove', 'keypress', 'click'].forEach(evt => {
                document.addEventListener(evt, resetInactivityTimer);
            });

            // Secret Admin Feature: Tap logo to export data
            logoImg.addEventListener('click', handleLogoTap);
        }

        function handleLogoTap() {
            logoTapCount++;
            clearTimeout(logoTapTimer);
            
            if (logoTapCount >= 5) {
                exportLocalData();
                logoTapCount = 0;
            } else {
                logoTapTimer = setTimeout(() => { logoTapCount = 0; }, 1000); // Reset count after 1s
            }
        }

        function exportLocalData() {
            if (sessionDataStore.length === 0) {
                showToast("No data to export yet!");
                return;
            }

            // Convert JSON array to CSV string
            const headers = ['Date', 'Sources', 'Other Details', 'Name', 'Phone', 'Email'];
            const csvRows = [headers.join(',')];

            sessionDataStore.forEach(row => {
                const sourcesStr = `"${row.sources.join(', ')}"`;
                const otherStr = `"${row.otherText.replace(/"/g, '""')}"`;
                const nameStr = `"${row.customerName.replace(/"/g, '""')}"`;
                const phoneStr = `"${row.customerPhone.replace(/"/g, '""')}"`;
                const emailStr = `"${row.customerEmail.replace(/"/g, '""')}"`;
                
                csvRows.push([row.timestamp, sourcesStr, otherStr, nameStr, phoneStr, emailStr].join(','));
            });

            const csvString = csvRows.join('\n');
            const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `tenacity-survey-${new Date().getTime()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showToast("Session data exported successfully!");
        }

        function showToast(msg) {
            toast.innerHTML = `<i class="fa-solid fa-info-circle text-blue-500 mr-2"></i> ${msg}`;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        function submitSurvey() {
            if (!submitBtn.classList.contains('active')) return;
            
            resetInactivityTimer();
            
            // Gather Selected Labels
            const selectedLabels = Array.from(selectedOptionIds).map(id => {
                const opt = surveyOptions.find(o => o.id === id);
                return opt.label.replace(/<[^>]*>?/gm, ' ').trim(); // Strip HTML
            });

            const responseData = {
                timestamp: new Date().toLocaleString(),
                sources: selectedLabels,
                otherText: selectedOptionIds.has('other') ? otherTextInput.value.trim() : '',
                customerName: document.getElementById('nameInput').value.trim(),
                customerPhone: document.getElementById('phoneInput').value.trim(),
                customerEmail: document.getElementById('emailInput').value.trim()
            };

            // Save to In-Memory Local Database
            sessionDataStore.push(responseData);
            console.log("Locally stored response:", responseData);

            showSuccess();
        }

        function showSuccess() {
            successOverlay.classList.add('show');
            
            let secondsLeft = 5;
            resetTimerEl.textContent = secondsLeft;
            
            const countdown = setInterval(() => {
                secondsLeft--;
                resetTimerEl.textContent = secondsLeft;
                
                if (secondsLeft <= 0) {
                    clearInterval(countdown);
                    resetForm();
                }
            }, 1000);
        }

        function resetForm() {
            // Reset State
            selectedOptionIds.clear();
            
            // Reset Inputs
            document.querySelectorAll('input').forEach(input => input.value = '');
            
            // Reset UI Visibility
            document.querySelectorAll('.option-card').forEach(card => card.classList.remove('selected'));
            otherInputSection.classList.remove('show');
            contactSection.classList.remove('show');
            submitBtn.classList.remove('active');
            successOverlay.classList.remove('show');
            
            // Ensure scroll is at top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetInactivityTimer() {
            clearTimeout(inactivityTimer);
            if (!successOverlay.classList.contains('show')) {
                inactivityTimer = setTimeout(() => {
                    if (selectedOptionIds.size > 0 || otherTextInput.value !== '' || document.getElementById('nameInput').value !== '') {
                        console.log("Kiosk reset due to inactivity");
                        resetForm();
                    }
                }, INACTIVITY_TIMEOUT);
            }
        }

        function toggleFullScreen() {
            const fsIcon = document.getElementById('fs-icon');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Fullscreen error: ${err.message}`);
                });
                fsIcon.classList.replace('fa-expand', 'fa-compress');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    fsIcon.classList.replace('fa-compress', 'fa-expand');
                }
            }
        }

        // Start App
        window.onload = init;

    </script>
</body>
</html>

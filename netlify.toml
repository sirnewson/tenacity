[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Asset paths must 404 when the file is genuinely missing. Without these the
# catch-all below answers 200 with index.html, so a broken image looks like a
# successful request and only the content-type gives it away.
[[redirects]]
  from = "/brand/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/assets/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/apps/*"
  to = "/index.html"
  status = 404

# The studio is one page - its steps are state, not routes - but a stray deep
# link should still land on the app rather than Netlify's 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
